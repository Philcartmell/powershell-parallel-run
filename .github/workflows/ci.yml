name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install PSScriptAnalyzer + Pester
        shell: pwsh
        run: |
          Set-PSResourceRepository -Name PSGallery -Trusted
          Install-PSResource -Name PSScriptAnalyzer -TrustRepository -Scope CurrentUser
          Install-PSResource -Name Pester -Version '5.5.0' -TrustRepository -Scope CurrentUser

      - name: Validate module manifest
        shell: pwsh
        run: Test-ModuleManifest -Path ./psp-run.psd1

      - name: Lint (PSScriptAnalyzer)
        shell: pwsh
        run: |
          $results = Invoke-ScriptAnalyzer -Path . -Recurse -Settings ./PSScriptAnalyzerSettings.psd1
          $results | Format-Table -AutoSize
          if ($results | Where-Object Severity -in 'Error', 'Warning') {
            throw 'PSScriptAnalyzer found issues — see the table above.'
          }

      - name: Test (Pester)
        shell: pwsh
        run: |
          $config = New-PesterConfiguration
          $config.Run.Path = './Tests'
          $config.Run.Exit = $true
          $config.Output.Verbosity = 'Detailed'
          Invoke-Pester -Configuration $config
