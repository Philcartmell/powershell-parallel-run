name: Publish to PowerShell Gallery

# Triggered only by publishing a GitHub Release (not by every push/tag) — that's a
# deliberate, reviewable human action, not something that happens by pushing to main.
# See PUBLISHING.md for the one-time setup this workflow depends on (the API key +
# the `gallery-publish` environment's required-reviewer protection rule).
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    runs-on: windows-latest
    # This environment must be created under repo Settings > Environments with at least
    # one required reviewer — see PUBLISHING.md. That's what turns "a release got
    # published" into "and a human then approved this specific gallery publish", and it's
    # also what scopes the PSGALLERY_API_KEY secret so it's only ever readable by a run
    # that has cleared that gate (it is NOT a repo-level secret).
    environment: gallery-publish
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install PSScriptAnalyzer + Pester
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module -Name PSScriptAnalyzer -Force -Scope CurrentUser
          Install-Module -Name Pester -MinimumVersion '5.5.0' -Force -Scope CurrentUser -SkipPublisherCheck

      - name: Lint (PSScriptAnalyzer)
        shell: pwsh
        run: |
          $results = Invoke-ScriptAnalyzer -Path . -Recurse -Settings ./PSScriptAnalyzerSettings.psd1
          $results | Format-Table -AutoSize
          if ($results | Where-Object Severity -in 'Error', 'Warning') {
            throw 'PSScriptAnalyzer found issues — aborting publish.'
          }

      - name: Test (Pester)
        shell: pwsh
        run: |
          $config = New-PesterConfiguration
          $config.Run.Path = './Tests'
          $config.Run.Exit = $true
          Invoke-Pester -Configuration $config

      - name: Stamp the release version into the manifest
        shell: pwsh
        run: |
          # The GitHub Release tag is the single source of truth for the published
          # version (the draft's version was computed automatically by release-draft.yml).
          # Stamp it into ModuleVersion here in the ephemeral build so there's no manual
          # bump-the-manifest-in-a-PR step and no "tag must match manifest" failure mode.
          # This is NOT committed back — the committed ParallelRun.psd1 ModuleVersion is
          # only a seed for the very first release (see PUBLISHING.md).
          $tag = '${{ github.event.release.tag_name }}' -replace '^v', ''
          if ($tag -notmatch '^\d+\.\d+\.\d+$') {
            throw "Release tag '${{ github.event.release.tag_name }}' is not a vMAJOR.MINOR.PATCH tag."
          }
          $psd1 = './ParallelRun.psd1'
          $content = Get-Content $psd1 -Raw
          # Guard on the PATTERN being present, not on the content changing — on the very
          # first release the tag (e.g. 0.1.0) equals the committed seed version, so
          # stamping is a legitimate no-op and "$stamped -eq $content" would false-positive.
          if ($content -notmatch "ModuleVersion\s*=\s*'[^']*'") {
            throw "Could not find a ModuleVersion line to stamp in $psd1."
          }
          $stamped = $content -replace "ModuleVersion(\s*)=(\s*)'[^']*'", "ModuleVersion`$1=`$2'$tag'"
          Set-Content -Path $psd1 -Value $stamped -NoNewline
          $manifest = Test-ModuleManifest -Path $psd1
          if ($manifest.Version.ToString() -ne $tag) {
            throw "Manifest version ($($manifest.Version)) did not stamp to $tag."
          }
          Write-Host "Publishing ParallelRun v$tag"

      - name: Stage the module for publishing
        shell: pwsh
        run: |
          # Publish-Module -Path requires the folder to be NAMED after the module and to
          # contain <ModuleName>.psd1. The repo root is 'powershell-parallel-run' (the repo
          # name) not 'ParallelRun', so publishing from '.' fails with "no valid module
          # found". Stage only the module's own files into a correctly-named ParallelRun/
          # folder — this also keeps .github/, Tests/, and docs OUT of the published package.
          $dist = Join-Path $env:RUNNER_TEMP 'ParallelRun'
          if (Test-Path $dist) { Remove-Item $dist -Recurse -Force }
          New-Item -ItemType Directory -Path $dist -Force | Out-Null
          Copy-Item ./ParallelRun.psd1, ./ParallelRun.psm1, ./LICENSE, ./README.md -Destination $dist
          Copy-Item ./Public, ./Private -Destination $dist -Recurse
          Test-ModuleManifest -Path (Join-Path $dist 'ParallelRun.psd1') | Out-Null
          "MODULE_DIST=$dist" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Publish to PowerShell Gallery
        shell: pwsh
        env:
          # Environment secret (gallery-publish), not a repo secret — see PUBLISHING.md
          # for how it's scoped/created/rotated. Never echoed; Publish-Module doesn't log
          # it either.
          PSGALLERY_API_KEY: ${{ secrets.PSGALLERY_API_KEY }}
        run: |
          Publish-Module -Path $env:MODULE_DIST -NuGetApiKey $env:PSGALLERY_API_KEY -Repository PSGallery
